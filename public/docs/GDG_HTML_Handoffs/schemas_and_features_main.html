<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schemas & Features</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, sans-serif; display: flex; flex-direction: column; background: #fff; }
        .topbar { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 15px; }
        .topbar select { padding: 8px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: white; cursor: pointer; min-width: 300px; }
        .topbar select:hover { border-color: #94a3b8; }
        .topbar label { color: #1e293b; }
        iframe { flex: 1; border: none; width: 100%; }
        .placeholder { display: flex; flex: 1; align-items: center; justify-content: center; color: #94a3b8; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <label for="schema-select"><strong>Select Document:</strong></label>
        <select id="schema-select" onchange="loadContent(this.value)">
            <option value="" disabled selected>-- Select a Schema / Feature --</option>
            <optgroup label="Web / HTML Versions">
                <option value="../gdg database.html">GDG Database Schema (HTML)</option>
                <option value="../app features schema.html">App Features Schema (HTML)</option>
                <option value="../backend schems.html">Backend Schema (HTML)</option>
                <option value="../web feature schema.html">Web Feature Schema (HTML)</option>
                <option value="../master project arcitecture.html">Master Project Architecture (HTML)</option>
            </optgroup>
            <optgroup label="PDF Versions">
                <option value="../Database Schema - GDG Management Portal.pdf">Database Schema (PDF)</option>
                <option value="../App Features Technical Specification.pdf">App Features Specification (PDF)</option>
                <option value="../Backend API Architecture Specification.pdf">Backend API Specification (PDF)</option>
                <option value="../Web Features Technical Specification.pdf">Web Features Specification (PDF)</option>
                <option value="../GDG Management Portal - Feature Overview (For PR & Product Team).pdf">Feature Overview (PDF)</option>
            </optgroup>
        </select>
    </div>
    <div id="placeholder" class="placeholder">Please select a document from the dropdown above.</div>
    <iframe id="doc-frame" src="" style="display: none;"></iframe>

    <script>
        function loadContent(value) {
            if (value) {
                document.getElementById('placeholder').style.display = 'none';
                const frame = document.getElementById('doc-frame');
                frame.style.display = 'block';
                frame.src = value;
            }
        }
    </script>
</body>
</html>
